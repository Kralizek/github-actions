name: Create release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version component to increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Calculate the release without creating or processing it
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Validate release source
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases must be dispatched from master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next release
        id: release
        uses: ./actions/calculate-next-release
        with:
          bump: ${{ inputs.version_bump }}

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  process:
    name: Process release
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/process-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
