name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate action folder contract
        shell: bash
        run: |
          shopt -s nullglob
          action_directories=(actions/*/)

          for directory in "${action_directories[@]}"; do
            test -f "${directory}action.yml" || {
              echo "::error file=${directory}::Missing action.yml"
              exit 1
            }

            test -f "${directory}README.md" || {
              echo "::error file=${directory}::Missing README.md"
              exit 1
            }
          done

      - name: Validate workflow documentation contract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          exports_file="docs/workflows/exports.txt"
          test -f "$exports_file" || {
            echo "::error file=${exports_file}::Missing exported workflow manifest"
            exit 1
          }

          is_exported() {
            local name="$1"
            grep -qxF "$name" "$exports_file"
          }

          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [[ "$name" == \#* ]] && continue

            workflow=".github/workflows/${name}.yml"
            doc="docs/workflows/${name}.md"

            test -f "$workflow" || {
              echo "::error file=${exports_file}::Exported workflow ${name} has no matching ${workflow}"
              exit 1
            }

            test -f "$doc" || {
              echo "::error file=${workflow}::Exported workflow ${name} is missing ${doc}"
              exit 1
            }

            grep -qE '^[[:space:]]+workflow_call:' "$workflow" || {
              echo "::error file=${workflow}::Exported workflow ${name} is not reusable via workflow_call"
              exit 1
            }
          done < "$exports_file"

          for doc in docs/workflows/*.md; do
            name="$(basename "$doc" .md)"
            is_exported "$name" || {
              echo "::error file=${doc}::Workflow documentation exists but ${name} is not listed in ${exports_file}"
              exit 1
            }
          done

          for workflow in .github/workflows/*.yml; do
            grep -qE '^[[:space:]]+workflow_call:' "$workflow" || continue
            name="$(basename "$workflow" .yml)"

            if is_exported "$name"; then
              continue
            fi

            grep -q '^# internal-workflow$' "$workflow" || {
              echo "::error file=${workflow}::Reusable workflow must be exported in ${exports_file} or marked with # internal-workflow"
              exit 1
            }
          done

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find actions tests -type f -name '*.sh' -print0)

      - name: Type-check Deno action
        run: deno check actions/calculate-next-release/index.ts

      - name: Run Bash tests
        shell: bash
        run: bash tests/run.sh

      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.7
