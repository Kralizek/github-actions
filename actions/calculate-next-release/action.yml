name: Calculate next release
description: Calculate the next repository release identifier from Git tags.

inputs:
  scheme:
    description: Release identifier scheme. Currently only periodic is supported.
    required: false
    default: periodic
  period:
    description: Sequence reset boundary used by the periodic scheme: year, month, week, or day.
    required: false
    default: month
  format:
    description: Release format containing exactly one {date:...} token and one {sequence:N} token.
    required: false
    default: ''

outputs:
  release:
    description: Calculated or reused release identifier.
  tag:
    description: Calculated or reused release tag.
  previous-tag:
    description: Previous valid release tag.
  scheme:
    description: Release identifier scheme used for the result.
  period:
    description: Rendered date portion used by the current period.
  sequence:
    description: Zero-padded release sequence within the period.

runs:
  using: node20
  main: dist/index.js
