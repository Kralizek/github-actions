name: Calculate next release
description: Calculate the next stable or prerelease SemVer release from Git tags.

inputs:
  bump:
    description: "Version component to increment after an existing stable release: patch, minor, or major."
    required: true
  channel:
    description: Optional prerelease channel, for example alpha, beta, or rc.
    required: false
    default: ''
  version:
    description: Optional explicit SemVer version. Overrides calculation but still obeys release policy.
    required: false
    default: ''
  minimum-version:
    description: Optional stable SemVer floor. Also replaces the default 0.1.0 bootstrap target when no stable tag exists.
    required: false
    default: ''
  tag-prefix:
    description: Prefix used by release tags.
    required: false
    default: v

outputs:
  version:
    description: Calculated, explicitly selected, or reused SemVer version without the tag prefix.
    value: ${{ steps.calculate.outputs.version }}
  tag:
    description: Calculated, explicitly selected, or reused release tag including the configured prefix.
    value: ${{ steps.calculate.outputs.tag }}
  previous-tag:
    description: Stable release tag used as the calculation baseline.
    value: ${{ steps.calculate.outputs.previous-tag }}
  base-version:
    description: Stable SemVer target before any prerelease channel is applied.
    value: ${{ steps.calculate.outputs.base-version }}
  prerelease:
    description: Whether the selected release is a prerelease.
    value: ${{ steps.calculate.outputs.prerelease }}
  channel:
    description: Prerelease channel used for the selected version, or empty for a stable release.
    value: ${{ steps.calculate.outputs.channel }}

runs:
  using: composite
  steps:
    - name: Calculate next release
      id: calculate
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        CHANNEL: ${{ inputs.channel }}
        VERSION_INPUT: ${{ inputs.version }}
        MINIMUM_VERSION: ${{ inputs.minimum-version }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: bash "${{ github.action_path }}/calculate.sh"
