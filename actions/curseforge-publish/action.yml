name: Publish to CurseForge
description: Discover CurseForge game version IDs and upload an existing release artifact.

inputs:
  token:
    description: CurseForge upload API token
    required: true
  project-id:
    description: CurseForge project ID
    required: true
  game:
    description: CurseForge game endpoint (for example wow)
    required: true
  game-version:
    description: Exact game version name or slug
    required: true
  game-version-type:
    description: Version type name, slug, or numeric ID; required when version is ambiguous
    required: false
    default: ''
  game-version-id:
    description: Explicit positive numeric version ID override (bypasses discovery)
    required: false
    default: ''
  file:
    description: Path to the already-built release artifact
    required: true
  release-type:
    description: alpha, beta, or release
    required: true
  display-name:
    description: CurseForge file display name
    required: false
    default: ''
  changelog:
    description: Release changelog contents
    required: false
    default: ''
  changelog-type:
    description: text, html, or markdown
    required: false
    default: markdown
  dry-run:
    description: Resolve and validate without uploading
    required: false
    default: 'false'

outputs:
  game-version-id:
    description: Resolved CurseForge game version ID
    value: ${{ steps.publish.outputs.game-version-id }}
  file-id:
    description: Uploaded CurseForge file ID (empty for dry runs)
    value: ${{ steps.publish.outputs.file-id }}

runs:
  using: composite
  steps:
    - name: Resolve version and publish artifact
      id: publish
      shell: bash
      env:
        CURSEFORGE_TOKEN: ${{ inputs.token }}
        CF_PROJECT_ID: ${{ inputs.project-id }}
        CF_GAME: ${{ inputs.game }}
        CF_GAME_VERSION: ${{ inputs.game-version }}
        CF_GAME_VERSION_TYPE: ${{ inputs.game-version-type }}
        CF_GAME_VERSION_ID: ${{ inputs.game-version-id }}
        CF_FILE: ${{ inputs.file }}
        CF_RELEASE_TYPE: ${{ inputs.release-type }}
        CF_DISPLAY_NAME: ${{ inputs.display-name }}
        CF_CHANGELOG: ${{ inputs.changelog }}
        CF_CHANGELOG_TYPE: ${{ inputs.changelog-type }}
        CF_DRY_RUN: ${{ inputs.dry-run }}
      run: python3 "${{ github.action_path }}/publish.py"
